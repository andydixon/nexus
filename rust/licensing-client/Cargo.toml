[package]
name = "licensing-client"
version = "0.1.0"
edition = "2021"
description = "Client for the licensing service: activation, renewal and offline verification of signed leases"
license = "UNLICENSED"
publish = false

[lib]
name = "licensing_client"

[dependencies]
base64 = "0.22.1"
ciborium = "0.2.2"
ed25519-dalek = "2.2.0"
p256 = { version = "0.13.2", features = ["ecdsa"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }

[dev-dependencies]
hex = "0.4.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
