[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev.package."*"]
opt-level = 2

# The terminal parser is generic and gets instantiated in the app crate; unoptimised it is ~50x slower.
[profile.dev.package.nexus]
opt-level = 2

[profile.release]
lto = "thin"
