[workspace]
resolver = "3"
members = ["core", "app"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev.package."*"]
opt-level = 2

# The terminal parser is generic and gets instantiated in the app crate; unoptimised it is ~50x slower.
[profile.dev.package.nexus]
opt-level = 2

[profile.release]
lto = "thin"

# IronRDP compatibility patches; see vendor/README.md for what each changes and when to drop it.
[patch.crates-io]
picky = { path = "vendor/picky" }
sspi = { path = "vendor/sspi" }
ironrdp-session = { path = "vendor/ironrdp-session" }
ironrdp-mstsgu = { path = "vendor/ironrdp-mstsgu" }
