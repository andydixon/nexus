name: CI

on:
    push:
        branches: ["**"]
    pull_request:

jobs:
    test:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-22.04, macos-14, windows-latest]
        defaults:
            run:
                shell: bash
                working-directory: rust
        steps:
            - uses: actions/checkout@v4
            - name: Linux dependencies (GUI libs, and sshd for the SSH integration tests)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev libgtk-3-dev openssh-server
            - run: cargo test --locked --workspace
            - run: cargo fmt --all --check
            - run: cargo clippy --locked --workspace --all-targets -- -D warnings
