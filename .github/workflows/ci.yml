# Format, lint and test on every OS. Same shape in every Uncomplex app repo.
name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    test:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-22.04, macos-14, windows-latest]
        defaults:
            run:
                shell: bash
                working-directory: rust
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  components: rustfmt, clippy
            - name: Linux build dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev libgtk-3-dev libasound2-dev openssh-server zip
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
              with:
                  key: ci
                  workspaces: rust
            - run: cargo fmt --all --check
            - run: cargo clippy --locked --workspace --all-targets -- -D warnings
            - run: cargo test --locked --workspace

    audit:
        name: Dependency audit
        runs-on: ubuntu-22.04
        defaults:
            run:
                shell: bash
                working-directory: rust
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
            - run: cargo install cargo-audit --locked
            # Ignored advisories and their reasons live in rust/.cargo/audit.toml; the fuzz workspace has its own lockfile.
            - run: cargo audit --deny yanked && cargo audit --deny yanked --file fuzz/Cargo.lock
